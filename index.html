    }).map(function (x) { return x.it; });
  }

  /* ===== Megjelenítés ===== */

  function edBar(kind, id, order) {
    if (!editing) { return ""; }
    var a = ' data-kind="' + kind + '" data-id="' + esc(id) + '"';
    return '<div class="edbar">' +
      '<button type="button" class="mini" data-act="edit"' + a + ">Szerkesztés</button>" +
      (order ? '<button type="button" class="mini" data-act="up"' + a + ' aria-label="Feljebb">↑</button><button type="button" class="mini" data-act="down"' + a + ' aria-label="Lejjebb">↓</button>' : "") +
      '<button type="button" class="mini del" data-act="del"' + a + ">Törlés</button></div>";
  }
  function addBtn(kind, text) {
    return editing ? '<button type="button" class="addbtn" data-act="add" data-kind="' + kind + '">+ ' + text + "</button>" : "";
  }

  function card(v, big) {
    var s = ser(v.series);
    var href = safeUrl(v.url, S.channelUrl);
    var part = v.ep ? v.ep + ". rész" : (v.label || "");
    var label = [v.title, s.short, part, v.date ? fmtDate(v.date) : "", v.dur, v.sample ? "minta" : ""].filter(Boolean).join(", ");
    var ep = v.ep
      ? '<span class="ep"><small>Rész</small>' + pad(+v.ep) + "</span>"
      : '<span class="ep ep-t"><small>Videó</small>' + esc(v.label || s.short) + "</span>";
    var badge = v.sample ? '<span class="tagm">Minta</span>' : (v.date && daysAgo(v.date) <= 7 ? '<span class="new">Új</span>' : "");
    return '<a class="vid sc' + s.c + (big ? " vid-big" : "") + '" href="' + esc(href) + '" target="_blank" rel="noopener" aria-label="' + esc(label) + '">' +
      '<span class="thumb pc' + s.c + '" aria-hidden="true">' + badge + '<span class="play"></span>' + ep +
        (v.dur ? '<span class="dur">' + esc(v.dur) + "</span>" : "") + "</span>" +
      '<span class="vmeta"><span class="vtag"><span class="sw"></span>' + esc(s.short) + "</span>" +
        '<span class="vtitle">' + esc(v.title) + "</span>" +
        (v.date ? '<span class="vdate">' + fmtDate(v.date) + "</span>" : "") + "</span></a>";
  }

  function renderTop() {
    var sample = hasSamples();
    $("note").hidden = !sample;
    $("mintaFoot").textContent = sample ? " · mintaoldal" : "";
    $("year").textContent = new Date().getFullYear();
    $("top").classList.toggle("editing", editing);
    var links = document.querySelectorAll("[data-channel]");
    for (var i = 0; i < links.length; i++) { links[i].setAttribute("href", safeUrl(S.channelUrl, "https://www.youtube.com/")); }
  }

  function renderLatest() {
    var f = S.videos.filter(function (v) { return v.featured; })[0] || byDate(S.videos)[0];
    $("latest").innerHTML = f ? card(f, true) : '<p class="empty">Még nincs videó.</p>';
  }

  function renderBand() {
    $("sched").hidden = !S.series.length && !editing;
    $("slots").innerHTML = S.series.map(function (s) {
      return '<div class="si"><button type="button" class="slot sc' + s.c + '" data-act="filter" data-id="' + esc(s.id) + '">' +
        '<span class="cnt">' + count(s.id) + " videó</span>" +
        '<span class="sname-big">' + esc(s.short) + "</span>" +
        (s.kind ? '<span class="sub">' + esc(s.kind) + "</span>" : "") + "</button>" +
        edBar("series", s.id, true) + "</div>";
    }).join("");
    $("addSeries").innerHTML = addBtn("series", "Új sorozat");
  }

  function renderChips() {
    var items = [{ id: "all", name: "Mind", n: S.videos.length, c: -1 }];
    S.series.forEach(function (s) { items.push({ id: s.id, name: s.short, n: count(s.id), c: s.c }); });
    if (count("x")) { items.push({ id: "x", name: "Csatorna", n: count("x"), c: 0 }); }
    if (!items.some(function (i) { return i.id === current; })) { current = "all"; }
    $("chips").innerHTML = items.map(function (c) {
      return '<button type="button" class="chip' + (c.c >= 0 ? " sc" + c.c : "") + '" data-act="filter" data-id="' + esc(c.id) + '" aria-pressed="' + (c.id === current) + '">' +
        (c.c >= 0 ? '<span class="sw"></span>' : "") + esc(c.name) + ' <span class="n">' + c.n + "</span></button>";
    }).join("");
  }

  function renderGrid() {
    var list = byDate(S.videos).filter(function (v) { return current === "all" || vs(v) === current; });
    $("grid").innerHTML = list.length
      ? list.map(function (v) { return '<div class="gi">' + card(v, false) + edBar("video", v.id) + "</div>"; }).join("")
      : '<p class="empty">' + (S.videos.length ? "Ehhez a sorozathoz még nincs feltöltött videó." : "Még nincs videó.") + "</p>";
    $("addVideo").innerHTML = addBtn("video", "Új videó");
  }

  function renderNews() {
    var list = byDate(S.news);
    $("news").innerHTML = list.length ? list.map(function (n) {
      var s = n.series ? ser(n.series) : null;
      if (s === X) { s = null; }
      var mark = '<span class="tagm">Minta</span>';
      return '<li class="news-item"><p class="ndate">' + (n.date ? fmtDate(n.date) : (n.sample ? mark : "")) + "</p><div>" +
        '<p class="ntag' + (s ? " sc" + s.c : "") + '">' + (s ? '<span class="sw"></span>' + esc(s.short) : "Csatorna") + (n.date && n.sample ? " " + mark : "") + "</p>" +
        "<h3>" + esc(n.title) + '</h3><p class="nt">' + esc(n.text) + "</p>" + edBar("news", n.id) + "</div></li>";
    }).join("") : '<li class="empty">Még nincs hír.</li>';
    $("addNews").innerHTML = addBtn("news", "Új hír");
  }

  function renderFaq() {
    $("faq").innerHTML = S.faq.length ? S.faq.map(function (f, i) {
      return '<div class="fi"><details class="faq"' + (i === 0 ? " open" : "") + "><summary><span>" + esc(f.q) +
        (f.sample ? ' <span class="tagm">Minta</span>' : "") + "</span></summary><p>" + esc(f.a) + "</p></details>" +
        edBar("faq", f.id, true) + "</div>";
    }).join("") : '<p class="empty">Még nincs kérdés.</p>';
    $("addFaq").innerHTML = addBtn("faq", "Új kérdés");
  }

  function renderBar() {
    var el = $("editbar");
    if (!canEdit) { el.innerHTML = ""; return; }
    if (!editing) {
      el.innerHTML = '<button type="button" class="btn btn-p fab" data-act="start">Szerkesztés</button>';
      return;
    }
    var text = msg || (dirty ? dirty + " mentetlen módosítás" : "Szerkesztő mód. Nincs mentetlen módosítás.");
    el.innerHTML = '<div class="edit-bar" role="region" aria-label="Szerkesztés">' +
      '<p class="bar-msg" role="status">' + esc(text) + "</p>" +
      '<div class="bar-btns">' +
        '<button type="button" class="btn" data-act="settings">Csatorna linkje</button>' +
        (hasSamples() ? '<button type="button" class="btn" data-act="clear-samples">Minta törlése</button>' : "") +
        '<button type="button" class="btn btn-p" data-act="save"' + (dirty && !saving ? "" : " disabled") + ">Mentés</button>" +
        '<button type="button" class="btn" data-act="stop"' + (saving ? " disabled" : "") + ">" + (dirty ? "Elvetés" : "Kilépés") + "</button>" +
      "</div></div>";
  }

  function render() {
    renderTop(); renderLatest(); renderBand(); renderChips(); renderGrid(); renderNews(); renderFaq(); renderBar();
  }

  function setFilter(id) {
    current = id;
    var kids = $("chips").children;
    for (var i = 0; i < kids.length; i++) { kids[i].setAttribute("aria-pressed", String(kids[i].getAttribute("data-id") === current)); }
    renderGrid();
  }

  /* ===== Módosítások ===== */

  function stash() { put("ks_pending", JSON.stringify(S)); }
  function touch() { dirty++; msg = ""; stash(); render(); }

  function commit(kind, it, isNew) {
    var l = listOf(kind);
    if (isNew) {
      if (kind === "faq" || kind === "series") { l.push(it); } else { l.unshift(it); }
    } else {
      var i = idx(kind, it.id);
      if (i >= 0) { l[i] = it; } else { l.push(it); }
    }
    touch();
  }

  function removeItem(kind, id) {
    var i = idx(kind, id);
    if (i < 0) { return; }
    listOf(kind).splice(i, 1);
    if (kind === "series") {
      S.videos.forEach(function (v) { if (v.series === id) { v.series = "x"; } });
      S.news.forEach(function (n) { if (n.series === id) { n.series = ""; } });
    }
    touch();
  }

  function moveItem(kind, id, d) {
    var l = listOf(kind), i = idx(kind, id), j = i + d;
    if (i < 0 || j < 0 || j >= l.length) { return; }
    var t = l[i]; l[i] = l[j]; l[j] = t;
    touch();
  }

  function clearSamples() {
    S.videos = S.videos.filter(function (x) { return !x.sample; });
    S.news = S.news.filter(function (x) { return !x.sample; });
    S.faq = S.faq.filter(function (x) { return !x.sample; });
    touch();
  }

  function discard() {
    S = clone(SAVED);
    dirty = 0; editing = false; msg = "";
    put("ks_pending", null); put("ks_edit", null);
    render();
  }

  // Kétlépéses megerősítés: az első kattintás megjelöli a gombot, a második végrehajt
  function arm(b, fn) {
    if (b.getAttribute("data-armed") === "1") { fn(); return; }
    var old = b.textContent;
    b.setAttribute("data-armed", "1");
    b.textContent = "Biztosan?";
    setTimeout(function () {
      if (b.isConnected) { b.removeAttribute("data-armed"); b.textContent = old; }
    }, 3000);
  }

  /* ===== Űrlapok ===== */

  function fieldHtml(f) {
    var id = "f_" + f.name, v = f.value === undefined || f.value === null ? "" : String(f.value);
    var help = f.help ? '<p class="fh" id="' + id + '_h">' + esc(f.help) + "</p>" : "";
    var desc = f.help ? ' aria-describedby="' + id + '_h"' : "";
    var ph = f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : "";
    var ml = f.max ? ' maxlength="' + f.max + '"' : "";
    if (f.type === "checkbox") {
      return '<div class="fld"><label class="ck"><input type="checkbox" id="' + id + '" name="' + f.name + '"' + (f.value ? " checked" : "") + desc + "> " + esc(f.label) + "</label>" + help + "</div>";
    }
    if (f.type === "colors") {
      var sw = "";
      for (var n = 1; n <= 8; n++) {
        sw += '<label class="cp sc' + n + '"><input type="radio" name="' + f.name + '" value="' + n + '"' + (String(n) === v ? " checked" : "") + ' aria-label="Szín ' + n + '"><span></span></label>';
      }
      return '<fieldset class="fld"><legend class="fl">' + esc(f.label) + '</legend><div class="cps">' + sw + "</div></fieldset>";
    }
    var label = '<label class="fl" for="' + id + '">' + esc(f.label) + (f.required ? ' <span class="req" aria-hidden="true">*</span>' : "") + "</label>";
    var ctl;
    if (f.type === "textarea") {
      ctl = '<textarea id="' + id + '" name="' + f.name + '" rows="' + (f.rows || 4) + '"' + ml + ph + desc + ">" + esc(v) + "</textarea>";
    } else if (f.type === "select") {
      ctl = '<select id="' + id + '" name="' + f.name + '"' + desc + ">" + f.options.map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === v ? " selected" : "") + ">" + esc(o[1]) + "</option>";
      }).join("") + "</select>";
    } else {
      ctl = '<input id="' + id + '" name="' + f.name + '" type="' + f.type + '" value="' + esc(v) + '"' + ml + ph + desc +
        (f.type === "number" ? ' inputmode="numeric" min="' + (f.min || 0) + '"' : "") + ">";
    }
    return '<div class="fld">' + label + ctl + help + "</div>";
  }

  function readForm(form, fields) {
    var out = {};
    for (var i = 0; i < fields.length; i++) {
      var f = fields[i], el = form.elements[f.name];
      if (f.type === "checkbox") { out[f.name] = !!el.checked; continue; }
      var val = String(el.value || "").trim();
      if (f.required && !val) { return { error: "A(z) „" + f.label + "” megadása kötelező.", focus: el }; }
      if (val && f.type === "url" && !/^https?:\/\/\S+$/i.test(val)) { return { error: "A link http:// vagy https:// kezdetű legyen.", focus: el }; }
      if (val && f.pattern && !f.pattern.test(val)) { return { error: f.patternMsg, focus: el }; }
      out[f.name] = val;
    }
    return { values: out };
  }

  // A fókusz visszatérési pontja: a megnyomott gomb, vagy ha az újrarajzolás közben megszűnt, az azonos gomb
  function focusSelector(el) {
    if (!el || !el.getAttribute) { return ""; }
    var s = "";
    ["data-act", "data-kind", "data-id"].forEach(function (a) {
      var v = el.getAttribute(a);
      if (v) { s += "[" + a + '="' + String(v).replace(/["\\]/g, "") + '"]'; }
    });
    return s;
  }

  function openForm(cfg) {
    closeForm();
    lastFocus = document.activeElement;
    lastSel = focusSelector(lastFocus);
    var m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><form id="dlgForm" novalidate>' +
      '<h2 class="dlg-t" id="dlgT">' + esc(cfg.title) + "</h2>" + cfg.fields.map(fieldHtml).join("") +
      '<p class="err" id="dlgErr" role="alert"></p>' +
      '<div class="dlg-btns"><button type="submit" class="btn btn-p">Kész</button><button type="button" class="btn" data-close="1">Mégse</button></div>' +
      "</form></div>";
    document.body.appendChild(m);
    modal = m;
    var form = m.querySelector("form");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var r = readForm(form, cfg.fields);
      if (r.error) {
        $("dlgErr").textContent = r.error;
        if (r.focus && r.focus.focus) { r.focus.focus(); }
        return;
      }
      cfg.onSave(r.values);
      closeForm();
    });
    m.addEventListener("click", function (e) {
      if (e.target === m || e.target.closest("[data-close]")) { closeForm(); }
    });
    var first = form.querySelector("input,select,textarea");
    if (first) { first.focus(); }
  }

  function closeForm() {
    if (!modal) { return; }
    modal.remove();
    modal = null;
    var back = lastFocus && lastFocus.isConnected ? lastFocus : (lastSel ? document.querySelector(lastSel) : null);
    if (!back) { back = document.querySelector("#editbar button:not([disabled])"); }
    if (back && back.focus) { back.focus(); }
    lastFocus = null; lastSel = "";
  }

  function onKey(e) {
    if (!modal) { return; }
    if (e.key === "Escape") { e.preventDefault(); closeForm(); return; }
    if (e.key !== "Tab") { return; }
    var f = modal.querySelectorAll('input:not([type="radio"]),input[type="radio"]:checked,select,textarea,button');
    if (!f.length) { return; }
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  // A sorozat legnagyobb részszáma + 1 (szövegként); ha a sorozatnak még nincs számozott videója, üres
  function nextEp(sid) {
    var m = 0;
    S.videos.forEach(function (v) { if (v.series === sid && +v.ep > m) { m = +v.ep; } });
    return m > 0 ? String(m + 1) : "";
  }

  var DATE_RX = /^\d{4}-\d{2}-\d{2}$/;
  var DATE_MSG = "A dátum így nézzen ki: 2026-11-03.";

  function openItem(kind, id) {
    var cur = id ? find(kind, id) : null, isNew = !cur;
    cur = cur || {};

    if (kind === "video") {
      var opts = S.series.map(function (s) { return [s.id, s.short]; });
      opts.push(["x", "Csatorna (nem sorozat)"]);
      // Új videónál az éppen szűrt sorozat az alapértelmezett, a rész száma pedig a következő szám
      var pre = cur.series || (current !== "all" && (current === "x" || ser(current) !== X) ? current : (S.series[0] ? S.series[0].id : "x"));
      openForm({
        title: isNew ? "Új videó" : "Videó szerkesztése",
        fields: [
          { name: "title", label: "Videó címe", type: "text", required: true, max: 140, value: cur.title },
          { name: "url", label: "Videó linkje a YouTube-on", type: "url", value: cur.url, placeholder: "https://www.youtube.com/watch?v=…", help: "Ha üresen hagyod, a csatorna oldalára mutat." },
          { name: "series", label: "Sorozat", type: "select", options: opts, value: pre },
          { name: "ep", label: "Rész száma", type: "number", min: 1, value: isNew ? nextEp(pre) : cur.ep, pattern: /^\d{1,4}$/, patternMsg: "A rész száma egész szám legyen.", help: "Ha megadod, ez látszik a bélyegképen. Új videónál a sorozat következő száma van beírva." },
          { name: "label", label: "Bélyegkép felirata", type: "text", max: 14, value: cur.label, help: "Rész száma nélkül ez a felirat látszik, például Himnusz." },
          { name: "date", label: "Feltöltés dátuma", type: "date", value: isNew ? today() : cur.date, pattern: DATE_RX, patternMsg: DATE_MSG },
          { name: "dur", label: "Hossz", type: "text", max: 8, value: cur.dur, placeholder: "14:22", pattern: /^\d{1,2}:\d{2}(:\d{2})?$/, patternMsg: "A hossz így nézzen ki: 14:22 vagy 1:02:15." },
          { name: "featured", label: "Ez legyen a kiemelt videó a nyitó részen", type: "checkbox", value: cur.featured }
        ],
        onSave: function (v) {
          var it = { id: cur.id || uid("v"), series: v.series || "x", title: v.title };
          if (v.url) { it.url = v.url; }
          if (v.ep) { it.ep = parseInt(v.ep, 10); }
          if (v.label) { it.label = v.label; }
          if (v.date) { it.date = v.date; }
          if (v.dur) { it.dur = v.dur; }
          if (v.featured) {
            it.featured = true;
            S.videos.forEach(function (o) { if (o.id !== it.id) { delete o.featured; } });
          }
          commit("video", it, isNew);
        }
      });
      if (isNew) {
        var selEl = $("f_series"), epEl = $("f_ep"), auto = epEl.value;
        selEl.addEventListener("change", function () {
          if (epEl.value === auto) { auto = nextEp(selEl.value); epEl.value = auto; }
        });
      }
    } else if (kind === "news") {
      var so = [["", "Általános csatornahír"]].concat(S.series.map(function (s) { return [s.id, s.short]; }));
      openForm({
        title: isNew ? "Új hír" : "Hír szerkesztése",
        fields: [
          { name: "title", label: "A hír címe", type: "text", required: true, max: 120, value: cur.title },
          { name: "text", label: "Szöveg", type: "textarea", required: true, rows: 5, max: 600, value: cur.text },
          { name: "series", label: "Melyik sorozathoz tartozik?", type: "select", options: so, value: cur.series || "" },
          { name: "date", label: "Dátum", type: "date", value: isNew ? today() : cur.date, pattern: DATE_RX, patternMsg: DATE_MSG }
        ],
        onSave: function (v) {
          var it = { id: cur.id || uid("n"), series: v.series, title: v.title, text: v.text };
          if (v.date) { it.date = v.date; }
          commit("news", it, isNew);
        }
      });
    } else if (kind === "faq") {
      openForm({
        title: isNew ? "Új kérdés" : "Kérdés szerkesztése",
        fields: [
          { name: "q", label: "Kérdés", type: "text", required: true, max: 160, value: cur.q },
          { name: "a", label: "Válasz", type: "textarea", required: true, rows: 6, max: 1200, value: cur.a }
        ],
        onSave: function (v) { commit("faq", { id: cur.id || uid("q"), q: v.q, a: v.a }, isNew); }
      });
    } else if (kind === "series") {
      var used = S.series.map(function (s) { return s.c; }), free = 1;
      for (var n = 1; n <= 8; n++) { if (used.indexOf(n) < 0) { free = n; break; } }
      openForm({
        title: isNew ? "Új sorozat" : "Sorozat szerkesztése",
        fields: [
          { name: "name", label: "A sorozat teljes neve", type: "text", required: true, max: 80, value: cur.name },
          { name: "short", label: "Rövid név", type: "text", max: 24, value: cur.short, help: "Ez látszik a gombokon és a kártyákon. Ha üresen hagyod, a teljes név látszik." },
          { name: "kind", label: "Alcím", type: "text", max: 40, value: cur.kind, help: "A sorozatok sávjában a név alatt látszik, például Végigjátszás." },
          { name: "c", label: "Szín", type: "colors", value: cur.c || free }
        ],
        onSave: function (v) {
          commit("series", { id: cur.id || uid("s"), name: v.name, short: v.short || v.name, kind: v.kind, c: +v.c || free }, isNew);
        }
      });
    }
  }

  function openSettings() {
    openForm({
      title: "Csatorna linkje",
      fields: [
        { name: "channelUrl", label: "A YouTube-csatorna címe", type: "url", required: true, value: S.channelUrl, placeholder: "https://www.youtube.com/@csatornaneve", help: "A Feliratkozás és az Összes videó gomb ide mutat, és minden videó, aminek nincs saját linkje." }
      ],
      onSave: function (v) { S.channelUrl = v.channelUrl; touch(); }
    });
  }

  /* ===== Mentés: az oldal új verzióként közzéteszi önmagát ===== */

  function buildDoc() {
    var data = JSON.stringify(S).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
    // Pontosan az a szerkezet, amit az Artifact eszköz is előállít: a váz, a fej, a stílus, az adat, a program
    return DOC_START + HEAD +
      '<style id="css">' + $("css").textContent + "</style>" +
      '<div id="root"></div>' +
      '<script type="application/json" id="site-data">' + data + "<\/script>" +
      '<script id="app">' + $("app").textContent + "<\/script>\n" + DOC_END;
  }

  function errText(e) {
    var c = e && e.code;
    if (c === "conflict") { return "Közben új verzió készült az oldalból, ezért az oldal újratölt. A módosításaid megmaradnak, és az újratöltés után visszakerülnek."; }
    if (c === "not_writer" || c === "not_granted" || c === "consent_required" || c === "not_declared") { return "Ehhez az oldalhoz nincs szerkesztési jogosultságod."; }
    if (c === "rate_limited") { return "Túl gyakran mentesz. Várj egy kicsit, aztán próbáld újra."; }
    if (c === "too_large") { return "Az oldal mérete túl nagy a mentéshez."; }
    if (c === "capability_disabled" || c === "capability_removed") { return "A mentés ebben a nézetben nem érhető el."; }
    return "A mentés most nem sikerült. Próbáld újra.";
  }

  // Közzététel előtt: a kész dokumentumot visszaolvassuk, és csak akkor megy ki, ha önmagával egyezik
  function verifyDoc(doc) {
    if (doc.length > 8e6) { return "too_large"; }
    if (doc.indexOf("<!doctype html>") !== 0) { return "start"; }
    var p = new DOMParser().parseFromString(doc, "text/html");
    var d = p.getElementById("site-data"), a = p.getElementById("app"), c = p.getElementById("css"), r = p.getElementById("root");
    if (!d || !a || !c || !r || r.firstChild) { return "parts"; }
    if (a.textContent !== $("app").textContent || c.textContent !== $("css").textContent) { return "code"; }
    try { if (JSON.stringify(JSON.parse(d.textContent)) !== JSON.stringify(S)) { return "data"; } } catch (e) { return "data"; }
    return "";
  }

  function save() {
    if (!ns || saving || !dirty) { return; }
    var doc, bad;
    try { doc = buildDoc(); bad = verifyDoc(doc); } catch (e) { bad = "build"; }
    if (bad) {
      msg = bad === "too_large" ? errText({ code: "too_large" }) : "A mentés előkészítése nem sikerült, ezért nem történt mentés. A módosításaid megmaradtak az oldalon.";
      renderBar();
      return;
    }
    saving = true; msg = "Mentés…";
    put("ks_edit", "1"); stash();
    renderBar();
    ns.publish(doc).then(function () {
      put("ks_pending", null); put("ks_msg", "Mentve.");
      SAVED = clone(S); dirty = 0; saving = false; msg = "Mentve.";
      render();
    }, function (e) {
      saving = false; msg = errText(e);
      if (e && (e.code === "not_writer" || e.code === "not_granted" || e.code === "consent_required" || e.code === "not_declared")) { canEdit = false; editing = false; }
      render();
    });
  }

  /* ===== Indulás ===== */

  function onClick(e) {
    var b = e.target.closest("[data-act]");
    if (!b) { return; }
    var act = b.getAttribute("data-act"), kind = b.getAttribute("data-kind"), id = b.getAttribute("data-id");
    if (act === "filter") {
      setFilter(id);
      if (b.classList.contains("slot")) {
        var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        $("videok").scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
      }
    } else if (act === "start") { editing = true; put("ks_edit", "1"); render(); }
    else if (act === "stop") {
      if (dirty) { arm(b, discard); } else { editing = false; msg = ""; put("ks_edit", null); render(); }
    }
    else if (act === "add") { openItem(kind, null); }
    else if (act === "edit") { openItem(kind, id); }
    else if (act === "del") { arm(b, function () { removeItem(kind, id); }); }
    else if (act === "up" || act === "down") { moveItem(kind, id, act === "up" ? -1 : 1); }
    else if (act === "settings") { openSettings(); }
    else if (act === "clear-samples") { arm(b, clearSamples); }
    else if (act === "save") { save(); }
  }

  function initCaps() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") { return; }
    Promise.all([c.use("artifact"), c.use("user")]).then(function (r) {
      ns = r[0];
      if (!ns || !r[1]) { return false; }
      return Promise.resolve(r[1].canEdit()).catch(function () { return false; });
    }).then(function (ok) {
      if (!ok) { return; }
      canEdit = true;
      var p = get("ks_pending");
      if (p) {
        try {
          var ps = normalize(JSON.parse(p));
          if (JSON.stringify(ps) !== JSON.stringify(SAVED)) {
            S = ps; dirty = 1; editing = true;
            msg = "A mentetlen módosításaid visszakerültek az oldalra. Nézd át, és mentsd el őket.";
          } else { put("ks_pending", null); }
        } catch (e) { put("ks_pending", null); }
      }
      var done = get("ks_msg");
      if (done) { put("ks_msg", null); if (!msg) { msg = done; } }
      if (get("ks_edit") === "1") { editing = true; }
      render();
    }).catch(function () { /* olvasó nézet */ });
  }

  document.documentElement.setAttribute("lang", "hu");
  $("root").innerHTML = SHELL;
  $("root").addEventListener("click", onClick);
  document.addEventListener("keydown", onKey);
  render();
  initCaps();
})();
</script>

</body></html>
